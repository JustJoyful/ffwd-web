name: ci
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The checker-offset conformance cases run real FFmpeg. Same pinned static build as the Python repo (D-024).
      - name: Install the pinned FFmpeg 5.1.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.tar.xz" https://johnvansickle.com/ffmpeg/old-releases/ffmpeg-5.1.1-amd64-static.tar.xz
          echo "2d848c37f7f276be0262d9123a84fbfe72bb159921ffcce3bd7106f143d29f42  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP"
          echo "FFWD_FFMPEG_BIN=$RUNNER_TEMP/ffmpeg-5.1.1-amd64-static/ffmpeg" >> "$GITHUB_ENV"
          echo "FFWD_FFPROBE_BIN=$RUNNER_TEMP/ffmpeg-5.1.1-amd64-static/ffprobe" >> "$GITHUB_ENV"
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:build
  # End-to-end, scripted-policy lane: Playwright's Chromium (no GPU) against the dev servers in playwright.config.js,
  # where the model is replaced by scripted replies. The opt-in real-model tests (`pnpm test:browser-gguf`, they need a
  # model file and a long run) are NOT run here.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Specs build their fixture videos and compare outputs with real FFmpeg: the same pinned static build as `check`.
      - name: Install the pinned FFmpeg 5.1.1
        run: |
          curl -fsSL -o "$RUNNER_TEMP/ffmpeg.tar.xz" https://johnvansickle.com/ffmpeg/old-releases/ffmpeg-5.1.1-amd64-static.tar.xz
          echo "2d848c37f7f276be0262d9123a84fbfe72bb159921ffcce3bd7106f143d29f42  $RUNNER_TEMP/ffmpeg.tar.xz" | sha256sum -c -
          tar -xf "$RUNNER_TEMP/ffmpeg.tar.xz" -C "$RUNNER_TEMP"
          echo "FFWD_FFMPEG_BIN=$RUNNER_TEMP/ffmpeg-5.1.1-amd64-static/ffmpeg" >> "$GITHUB_ENV"
          echo "FFWD_FFPROBE_BIN=$RUNNER_TEMP/ffmpeg-5.1.1-amd64-static/ffprobe" >> "$GITHUB_ENV"
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e
      - name: Playwright results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
  # Budgets (DESIGN "Performance budget"): bundle sizes and Largest Contentful Paint, on the production build.
  budgets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Bundle size (home and chore page JavaScript, fonts)
        run: pnpm size
      # Lighthouse runs in Playwright's Chromium without a GPU, the same flags as the end-to-end tests.
      - run: pnpm exec playwright install --with-deps chromium
      - name: Lighthouse (largest contentful paint on / and a chore page)
        run: |
          export CHROME_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          pnpm lighthouse
